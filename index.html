async function submit(){nav.className='hide';show('<p class="sub">Отправляем ответы…</p>');const A=JSON.parse(JSON.stringify(st.A));A.lang=LANG||'ru';const S=score(A);
 let uid=localStorage.getItem('cc_uuid_'+K());if(!uid){uid=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();localStorage.setItem('cc_uuid_'+K(),uid)}
 const submittedAt=new Date();
 const payload={action:'submit',record_uuid:uid,participant_id:st.id,visit:st.visit,datetime:submittedAt.toISOString(),scores:S,answers:A};
 try{const r=await api(payload,4);try{localStorage.removeItem(K())}catch(e){}done(S,r,submittedAt)}
 catch(e){show(`<h1>Не удалось отправить</h1><p class="sub">${esc(msg(e))} Ответы сохранены на этом устройстве.</p><button class="pri" id="r" style="width:100%">Повторить отправку</button>`);$('#r').onclick=submit}}
function dateText(d){return new Intl.DateTimeFormat(EN?'en-GB':'ru-RU',{day:'2-digit',month:'long',year:'numeric'}).format(d)}
function makeSummary(A,S,at){
 const due=new Date(at);due.setDate(due.getDate()+14);const na=t('не указано','not specified'),f=v=>v===undefined||v===null||v===''?na:String(v),it=[];
 it.push(t('Боль сейчас: ','Pain right now: ')+(A.gp==='Y'?f(A.g1)+'/10':t('не отмечалась за последние 30 дней','no pain in the past 30 days'))+'.');
 if(A.gp==='Y'){it.push(t('Наибольшая боль за последние 30 дней: ','Worst pain in the past 30 days: ')+f(A.g2)+'/10.');it.push(t('Средняя боль за последние 30 дней: ','Average pain in the past 30 days: ')+f(A.g3)+'/10.');
  it.push(t('Влияние боли на повседневные дела: ','Interference with daily activities: ')+f(A.g4)+'/10.');it.push(t('Влияние боли на отдых и общение: ','Interference with recreation and social life: ')+f(A.g5)+'/10.');
  it.push(t('Влияние боли на работу или учёбу: ','Interference with work or study: ')+f(A.g6)+'/10.');it.push(t('Дней с ограничением обычных занятий: ','Days with limited activities: ')+f(A.g7)+t(' из 30.',' of 30.'))}
 it.push(t('Функция челюсти — JFLS-8 (среднее значение): ','Jaw function, JFLS-8 (mean score): ')+S.jfls8+'/10.');it.push(t('Ответы на вопросы GAD-7: ','GAD-7 score: ')+S.gad7+'/21.');
 it.push(t('Ответы на вопросы PHQ-9: ','PHQ-9 score: ')+S.phq9+'/27.');it.push(t('Ответы на вопросы PSQI: ','PSQI score: ')+S.psqi+'/21.');it.push(t('Ответы о привычках челюсти — OBC: ','Jaw habits, OBC: ')+S.obc+'/84.');
 const head=[t('Результаты заполнения SmartAIR TMD','SmartAIR TMD questionnaire results'),t('Код участника: ','Participant code: ')+st.id,t('Дата заполнения (T','Date completed (T')+(st.visit-1)+'): '+dateText(at),'',t('Показатели по вашим ответам:','Scores based on your answers:')];
 const tail=['',st.visit<3?t('Ориентировочная дата следующего заполнения (через 14 дней): ','Approximate date of the next questionnaire (in 14 days): ')+dateText(due)+'.':t('Все запланированные этапы заполнения завершены.','All scheduled questionnaires are complete.'),'',
  t('Карточка содержит числовые показатели и ответы из анкеты. Она не является диагнозом, медицинским заключением или рекомендацией по лечению.','This card contains numerical scores and answers from the questionnaire. It is not a diagnosis, medical report or treatment recommendation.')];
 return{text:[...head,...it,...tail].join('\n'),items:it,due:st.visit<3?dateText(due):null}}
function done(S,r,at){
 $('#bar i').style.width='100%';const last=st.visit>=3,sm=makeSummary(st.A,S,at);
 show(`<h1>${t('Анкета '+st.visit+' из 3 отправлена','Questionnaire '+st.visit+' of 3 submitted')}</h1>`+
 (S.alert?`<div class="warn"><b>${t('Если у вас есть мысли о причинении себе вреда','If you have thoughts of harming yourself')}</b>${t(', пожалуйста, сегодня же обратитесь за помощью: позвоните по номеру 112 или сообщите врачу.',', please seek help today: call your local emergency number (112 in Russia and the EU) or tell your doctor.')}</div>`:'')+
 `<section class="summary" id="patientSummary"><h2>${t('Ваши результаты SmartAIR TMD','Your SmartAIR TMD results')}</h2><p class="summary-note">${t('Информационная карточка по вашим ответам','Information card based on your answers')}</p>
 <p><b>${t('Код участника:','Participant code:')}</b> ${esc(st.id)}</p><p><b>${t('Дата заполнения (T','Date completed (T')}${st.visit-1}):</b> ${dateText(at)}</p>
 <div class="summary-results"><b>${t('Показатели по заполненным шкалам и вопросам','Scores for the completed scales and questions')}</b><ul>${sm.items.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></div>
 ${last?`<p><b>${t('Все запланированные этапы заполнения завершены.','All scheduled questionnaires are complete.')}</b></p>`:`<p><b>${t('Следующее заполнение (ориентировочно):','Next questionnaire (approximate date):')}</b> ${sm.due}</p>`}
 <p class="summary-note">${t('Здесь приведены только ваши ответы и рассчитанные по ним баллы. Карточка не устанавливает диагноз и не содержит рекомендаций по лечению.','This card shows only your answers and the scores calculated from them. It does not establish a diagnosis and contains no treatment recommendations.')}</p>
 <div class="summary-actions"><button class="pri" id="copySummary">${t('Скопировать результаты','Copy results')}</button><button id="printSummary">${t('Сохранить / распечатать','Save / print')}</button></div></section>`+
 (last?`<p class="sub">${t('Спасибо за участие!','Thank you for taking part!')}</p>`:`<p class="sub">${t('Сохраните код участника — он понадобится для следующего заполнения.','Save your participant code: you will need it for the next questionnaire.')}</p><div class="big">${esc(st.id)}</div>${linkBtn()}`));
 const cp=$('#copySummary'),ok=t('Скопировано','Copied');
 if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(sm.text);cp.textContent=ok}catch(e){const ta=document.createElement('textarea');ta.value=sm.text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cp.textContent=ok}catch(x){cp.textContent=t('Не удалось скопировать','Could not copy')}ta.remove()}};
 const pr=$('#printSummary');if(pr)pr.onclick=()=>window.print();bindLink()}
function boot(){if(!LANG)return langScreen();applyLang();if(qp.get('new')){localStorage.removeItem('cc_id');return home()}const id=(qp.get('id')||localStorage.getItem('cc_id')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(id.length>=4){st.id=id;start()}else home()}
boot();
