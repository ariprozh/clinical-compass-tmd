<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Кабинет врача</title>
<style>
:root{--b:#0f4c81;--bg:#f2f7fc;--c:#fff;--t:#0f172a;--m:#64748b;--l:#d3e0ee;--ok:#0d9488;--low:#3b82f6;--mid:#d97706;--hi:#e11d48}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--c:#142036;--t:#e8eef6;--m:#9fb0c6;--l:#2a3d5a;--b:#5aa2e6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--c);border-bottom:1px solid var(--l);padding:10px 16px;display:flex;gap:8px;align-items:center}header b{color:var(--b);flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:10px;padding:8px 12px}.pri{background:var(--b);color:#fff;border-color:var(--b);font-weight:600}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--l);border-radius:10px;background:var(--bg);color:var(--t);min-width:0}
.hide{display:none!important}.box{max-width:380px;margin:12vh auto;padding:22px;background:var(--c);border:1px solid var(--l);border-radius:16px}.box h1{margin:0 0 12px;font-size:22px}.box input{width:100%;margin:6px 0 10px}
.err{color:var(--hi);min-height:20px;font-size:14px}main{max-width:1180px;margin:0 auto;padding:14px}
#tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.tile{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:10px 12px;cursor:pointer}.tile b{display:block;font-size:24px}.tile span{color:var(--m);font-size:12px}
.wrap{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:14px;align-items:start}
.tools{display:flex;gap:8px;margin-bottom:10px}.tools input{flex:1}
.row{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;display:grid;gap:4px}.row.on{border-color:var(--b);box-shadow:0 0 0 2px #0f4c8133}
.row .a{display:flex;gap:8px;align-items:center;justify-content:space-between}.id{font:700 15px ui-monospace,monospace;letter-spacing:1px}.lb{color:var(--m);font-size:13px}.mt{color:var(--m);font-size:12px}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;color:#fff;white-space:nowrap}.ok{background:var(--ok)}.low{background:var(--low)}.mid{background:var(--mid)}.hi{background:var(--hi)}.nn{background:var(--m)}
.dots{letter-spacing:3px;color:var(--ok)}.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:12px}.card h3{margin:0 0 8px;font-size:16px}
.ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ph h2{margin:0;font:700 22px ui-monospace,monospace;letter-spacing:1px}.ph input{width:160px}
.alert{background:#fff1f2;color:#881337;border:1px solid #fda4af;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 6px;border-bottom:1px solid var(--l);text-align:center}td:first-child,th:first-child{text-align:left}th{color:var(--m);font-weight:600;font-size:12px}
td.v{font-weight:600}.d-g{color:var(--ok)}.d-r{color:var(--hi)}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button.on{background:var(--b);color:#fff;border-color:var(--b)}
.bl{display:grid;grid-template-columns:10px 1fr;gap:10px;margin:8px 0}.bl i{border-radius:4px}.bl b{display:block}
.rec{padding:8px 10px;border-radius:10px;margin:6px 0;border-left:4px solid var(--l);background:var(--bg)}.rec.u{border-color:var(--hi);background:#fff1f2;color:#881337}.rec.r{border-color:var(--mid)}.rec.i{border-color:var(--low)}
.note{color:var(--m);font-size:12px;margin-top:8px}ul{margin:4px 0;padding-left:20px}details summary{cursor:pointer;font-weight:600;margin:4px 0}
@media(max-width:860px){.wrap{display:block}body.det #lst{display:none}body:not(.det) #dt{display:none}}
@media print{header,#lst,#tiles,.tabs,.nopr{display:none!important}.wrap{display:block}body{background:#fff}.card{break-inside:avoid}}
</style></head><body>
<div id="login" class="box"><h1>Кабинет врача</h1><label>Ключ доступа</label><input id="key" type="password" autocomplete="current-password"><div class="err" id="le"></div><button class="pri" id="go" style="width:100%">Войти</button></div>
<div id="main" class="hide"><header><b>Кабинет врача</b><button id="rf">Обновить</button><button id="lo">Выйти</button></header>
<main><div id="tiles"></div><div class="wrap"><section id="lst"><div class="tools"><input id="q" placeholder="Поиск по коду или метке"><select id="fl"><option value="all">Все</option><option value="alert">Внимание</option><option value="late">Просрочены</option><option value="due">Пора заполнить</option><option value="wait">Ожидают</option><option value="done">Завершили</option></select></div><div id="rows"></div></section>
<section id="dt"></section></div></main></div>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbwn_zif8hGwHChKC-HhXns8T5dDTorR3bI70bFfl8uGkgy3Ou_cWn9hl-oGQl_W2f9d1g/exec';
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let KEY='',P=[],TODAY='',CUR=null,VIS=1,FL='all';const ANS={};
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
async function api(body,tries=2){let err;for(let i=0;i<tries;i++){const c=new AbortController(),t=setTimeout(()=>c.abort(),40000);try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,key:KEY}),signal:c.signal});const j=await r.json();if(j.status==='error'){j.fatal=1;throw j}return j}catch(e){err=e;if(e.fatal)break;await new Promise(r=>setTimeout(r,1200))}finally{clearTimeout(t)}}throw err}
const fm=(v,d)=>v==null?'—':String(Math.round(v*10**(d||0))/10**(d||0)).replace('.',','),fd=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'—';
const addD=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const BANDS={gad:[[0,'минимальная','ok'],[5,'лёгкая','low'],[10,'умеренная','mid'],[15,'тяжёлая','hi']],phq:[[0,'минимальные','ok'],[5,'лёгкие','low'],[10,'умеренные','mid'],[15,'умеренно тяжёлые','hi'],[20,'тяжёлые','hi']],
 psqi:[[0,'хорошее качество сна','ok'],[6,'плохое качество сна','mid'],[11,'выраженные нарушения сна','hi']],obc:[[0,'низкая частота привычек','ok'],[25,'умеренная','mid'],[40,'высокая','hi']],
 jfls:[[0,'минимальные ограничения','ok'],[1,'лёгкие','low'],[3,'умеренные','mid'],[5,'выраженные','hi']],cpi:[[0,'низкая интенсивность','ok'],[50,'высокая интенсивность','hi']]};
const band=(k,v)=>{if(v==null||!BANDS[k])return null;let b=null;BANDS[k].forEach(x=>{if(v>=x[0])b=x});return b};
const SC=[['cpi','Интенсивность боли (CPI)',100],['inf','Влияние боли',100],['jfls','JFLS-8',10],['gad','GAD-7',21],['phq','PHQ-9',27],['psqi','PSQI',21],['obc','OBC',84]];
const GR=['боли за последние 30 дней нет','градация I: низкая интенсивность боли, малое ограничение активности','градация II: высокая интенсивность боли, малое ограничение активности','градация III: умеренное ограничение активности из-за боли','градация IV: выраженное ограничение активности из-за боли'];
const JF=['жёсткую пищу','курицу','мягкую пищу','открывать рот для питья','глотать','зевать','разговаривать','улыбаться'];
const PS=['качество сна','время засыпания','длительность сна','эффективность сна','нарушения сна','снотворные','дневная сонливость'];
const OB=['скрип/сжатие зубов во сне','давление на челюсть во сне','скрип зубов днём','сжатие зубов днём','смыкание зубов вне еды','напряжение мышц лица','выдвижение челюсти','прижатие языка к зубам','язык между зубами','прикусывание языка/щёк/губ','«страховка» челюсти','предметы в зубах','жвачка','игра на инструменте','подпирание челюсти рукой','жевание одной стороной','перекусы','долгие разговоры','пение','зевание','телефон плечом'];
const MC={'антидепрессанты':/амитриптил|сертрал|эсциталопр|циталопр|флуоксет|пароксет|венлафакс|дулоксет|миртазап|тразодон|имипрам|вортиоксет/i,'НПВП и анальгетики':/ибупроф|кеторол|нимесул|диклофен|парацетам|напрокс|кетопроф|мелоксик|целекокс|анальгин|нурофен|трамад/i,'миорелаксанты':/тизанид|баклофен|толперизон|мидокалм|циклобензап|сирдалуд/i,'противосудорожные':/габапент|прегабал|карбамазеп|ламотридж|топирамат/i,'бензодиазепины и снотворные':/диазепам|клоназеп|алпразол|феназеп|лоразепам|зопиклон|золпидем|мелатонин|донормил/i};
const doneV=p=>[1,2,3].filter(v=>p.v[v]);
function pstat(p){const d=doneV(p),al=d.some(v=>p.v[v].s.alert);let s;
 if(!d.length)s={k:'new',t:'Не начал',c:'nn',o:5};else{const n=[1,2,3].find(v=>!p.v[v]);
  if(!n)s={k:'done',t:'Завершил',c:'ok',o:4};else{const due=p['due'+n]||addD(p.v[1].dt.slice(0,10),n===2?14:42);
   if(TODAY>addD(due,7))s={k:'late',t:'Просрочен: визит '+n,c:'hi',o:1};else if(TODAY>=addD(due,-2))s={k:'due',t:'Пора: визит '+n,c:'mid',o:2};else s={k:'wait',t:'Визит '+n+' с '+fd(addD(due,-2)),c:'low',o:3}}}
 return{...s,al}}
function tiles(){const st=P.map(pstat),n=f=>st.filter(f).length;
 $('#tiles').innerHTML=[['Всего пациентов',P.length,'all'],['Внимание',n(s=>s.al),'alert'],['Просрочены',n(s=>s.k==='late'),'late'],['Пора заполнить',n(s=>s.k==='due'),'due'],['Завершили',n(s=>s.k==='done'),'done']].map(t=>`<div class="tile" data-f="${t[2]}"><b>${t[1]}</b><span>${t[0]}</span></div>`).join('')}
function list(){const q=$('#q').value.trim().toUpperCase();let a=P.map(p=>({p,s:pstat(p)})).filter(x=>(!q||x.p.id.includes(q)||(x.p.label||'').toUpperCase().includes(q))&&(FL==='all'||(FL==='alert'?x.s.al:x.s.k===FL)));
 a.sort((x,y)=>(y.s.al-x.s.al)||(x.s.o-y.s.o)||x.p.id.localeCompare(y.p.id));
 $('#rows').innerHTML=a.map(({p,s})=>{const l=p.v[doneV(p).pop()],S=l&&l.s;return`<div class="row ${CUR===p.id?'on':''}" data-id="${p.id}"><div class="a"><span class="id">${esc(p.id)}</span><span>${s.al?'<span class="chip hi">Внимание</span> ':''}<span class="chip ${s.c}">${esc(s.t)}</span></span></div>
 <div class="lb">${esc(p.label||'без метки')} <span class="dots">${[1,2,3].map(v=>p.v[v]?'●':'○').join('')}</span></div>
 <div class="mt">${S?`${fd(l.dt.slice(0,10))} · боль ${fm(S.cpi)} · PHQ-9 ${fm(S.phq)} · GAD-7 ${fm(S.gad)} · PSQI ${fm(S.psqi)}`:'Анкет пока нет'}</div></div>`}).join('')||'<p class="note">Никого не найдено.</p>'}
async function load(){try{const r=await api({action:'doctor_list'});TODAY=r.today;P=r.patients;tiles();list();if(CUR&&P.find(p=>p.id===CUR))open(CUR,VIS)}catch(e){if(e.fatal&&/ключ/i.test(e.message||'')){logout();$('#le').textContent=e.message;return}alert(e.message||'Нет связи, повторите.')}}
function spark(vals,mx){const pts=vals.map((v,i)=>v==null?null:[8+i*30,24-(v/mx)*20]).filter(Boolean);return`<svg width="76" height="28">${pts.length>1?`<polyline fill="none" stroke="#0f4c81" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/>`:''}${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#0f4c81"/>`).join('')}</svg>`}
function analyze(p,v,A){const S=p.v[v].s,F=p.v[1].s,B=[],R=[],rec=(l,t)=>R.push({l,t}),num=x=>Number(x)||0,M=(A.meds||[]).filter(m=>m&&m.n),mc=k=>M.filter(m=>MC[k].test(m.n));
 const g=S.grade,bj=band('jfls',S.jfls),bg=band('gad',S.gad),bp=band('phq',S.phq),bs=band('psqi',S.psqi),bo=band('obc',S.obc);
 B.push({c:['ok','low','mid','hi','hi'][g]||'low',t:'Боль (GCPS)',x:`${GR[g]||'нет данных'}. Интенсивность (CPI) ${fm(S.cpi)}/100, влияние на жизнь ${fm(S.inf)}/100, дней с ограничением активности: ${fm(S.days)} из 30.`});
 const jw=JF.map((n,i)=>[n,num(A['j'+(i+1)])]).filter(x=>x[1]>=5).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
 B.push({c:bj?bj[2]:'nn',t:'Функция челюсти (JFLS-8)',x:`${fm(S.jfls,1)}/10: ${bj?bj[1]:'нет данных'}.${jw.length?' Труднее всего: '+jw.join(', ')+'.':''} Градации ориентировочные.`});
 B.push({c:bg?bg[2]:'nn',t:'Тревога (GAD-7)',x:`${fm(S.gad)}/21: ${bg?bg[1]:'нет данных'} выраженность.${S.gad>=10?' Выше порога скрининга (≥10).':''}`});
 B.push({c:bp?bp[2]:'nn',t:'Депрессивные симптомы (PHQ-9)',x:`${fm(S.phq)}/27: ${bp?bp[1]:'нет данных'} симптомы.${S.phq>=10?' Выше порога скрининга (≥10).':''}${S.item9>0?' Пункт 9 (мысли о смерти или самоповреждении): '+S.item9+' из 3.':''} Это скрининг, а не диагноз.`});
 const pc=(S.c||[]).map((x,i)=>x>=2?PS[i]:null).filter(Boolean);
 B.push({c:bs?bs[2]:'nn',t:'Сон (PSQI)',x:`${fm(S.psqi)}/21: ${bs?bs[1]:'нет данных'}.${pc.length?' Проблемные компоненты: '+pc.join(', ')+'.':''}`});
 const oh=OB.map((n,i)=>[n,num(A['o'+(i+1)])]).filter(x=>x[1]>=3).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]);
 B.push({c:bo?bo[2]:'nn',t:'Привычки челюсти (OBC)',x:`${fm(S.obc)}/84: ${bo?bo[1]:'нет данных'}.${oh.length?' Чаще всего: '+oh.join(', ')+'.':''} Границы ориентировочные.`});
 // рекомендации (для рассмотрения врачом)
 if(S.item9>0)rec('u',`Пациент отметил мысли о смерти или самоповреждении (PHQ-9, пункт 9: ${S.item9}). Рекомендуется связаться с пациентом в день получения результата, оценить суицидальный риск; при высоком риске направить к психиатру или вызвать экстренную помощь (112).`);
 if(S.phq>=20)rec('u','Тяжёлые депрессивные симптомы по PHQ-9: рекомендуется срочная консультация психиатра или врача, ведущего психическое здоровье.');
 else if(S.phq>=10)rec('r','Депрессивные симптомы выше порога скрининга (PHQ-9 ≥10): рекомендовать консультацию психолога, психотерапевта или врача по месту, повторить PHQ-9 через 2–4 недели.');
 if(S.gad>=15)rec('r','Выраженная тревога (GAD-7 ≥15): рекомендовать консультацию специалиста по психическому здоровью.');
 else if(S.gad>=10)rec('r','Тревога выше порога скрининга (GAD-7 ≥10): обсудить с пациентом, рассмотреть консультацию психолога, техники релаксации.');
 if(g>=3)rec('r','Хроническая боль с ограничением активности (GCPS III–IV): рассмотреть мультидисциплинарный план (стоматолог, невролог, психолог, физиотерапевт); предпочесть консервативные и обратимые методы, отложить необратимые вмешательства до оценки психосоциальных факторов.');
 else if(g===2)rec('r','Высокая интенсивность боли при малом ограничении (GCPS II): клинический осмотр по DC/TMD Axis I, обучение самопомощи, наблюдение в динамике.');
 else if(g===1)rec('i','Боль низкой интенсивности без выраженного ограничения (GCPS I): наблюдение, обучение самопомощи.');
 if(S.jfls>=3)rec('r','Выраженное ограничение функции челюсти: рассмотреть упражнения на подвижность и координацию нижней челюсти, мягкую диету на период обострения, физиотерапию по показаниям, оценку объёма открывания рта на осмотре.');
 if(S.psqi>5){let t='Плохое качество сна (PSQI >5): рекомендации по гигиене сна';if(num(A.p5i)>=2)t+='; сон нарушает боль, что стоит учесть в плане обезболивания';if(num(A.p5d)>=2||num(A.p5e)>=2)t+='; отмечены затруднённое дыхание или храп во сне: оценить риск апноэ и при необходимости направить к сомнологу или оториноларингологу';if(S.psqi>10)t+='; выраженные нарушения (PSQI >10): рассмотреть консультацию сомнолога или невролога';rec('r',t+'.')}
 if(S.obc>=25||num(A.o1)>=3){let t='Парафункциональные привычки: обучить самонаблюдению и контролю (напоминания, положение «губы сомкнуты, зубы разомкнуты», расслабление жевательных мышц)';if(num(A.o1)>=3)t+='; возможен бруксизм во сне: обсудить необходимость ночной каппы по результатам осмотра';rec('r',t+'.')}
 const sed=mc('бензодиазепины и снотворные'),ad=mc('антидепрессанты');
 if(sed.length&&(S.psqi>5||S.phq>=10||S.gad>=10))rec('r','Пациент принимает бензодиазепины или снотворные ('+sed.map(m=>m.n).join(', ')+') при выраженных нарушениях сна или настроения: оценить показания, риск зависимости и согласовать терапию с лечащим врачом.');
 if(ad.length)rec('i','Принимает антидепрессанты ('+ad.map(m=>m.n).join(', ')+'): учитывать при выборе фармакотерапии и возможных взаимодействиях.');
 if(mc('миорелаксанты').length||mc('противосудорожные').length)rec('i','Принимает миорелаксанты или противосудорожные препараты: учитывать при оценке боли и сонливости.');
 const ch=M.filter(m=>['new','dose','stop'].includes(m.c));if(ch.length)rec('i','В этот период менялась терапия: '+ch.map(m=>m.n+' ('+({new:'начат',dose:'изменена доза',stop:'отменён'}[m.c])+')').join(', ')+'.');
 if(num(A.caf)>=4)rec('i','Много кофеина (≥4 порций в день): рекомендовать снизить, может усиливать мышечное напряжение и ухудшать сон.');
 if(A.smk==='c'||A.smk==='v')rec('i','Курение или вейпинг: рекомендовать отказ от никотина.');
